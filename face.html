<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>あ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="face-page">
  <main class="face-stage" aria-label="泣きながら笑っているように生成された架空の高年男性の顔画像">
    <figure class="face-frame">
      <div class="face-photo-wrap">
        <img src="assets/generated-elderly-face.svg" alt="泣きながら笑っている架空の高年男性の生成画像">
        <span class="tear tear-left" aria-hidden="true"></span>
        <span class="tear tear-right" aria-hidden="true"></span>
        <span class="fear-eye fear-eye-left" aria-hidden="true"></span>
        <span class="fear-eye fear-eye-right" aria-hidden="true"></span>
        <span class="face-noise" aria-hidden="true"></span>
      </div>
      <figcaption>
        Generated image. No real person is used.
      </figcaption>
    </figure>
  </main>
</body>
</html>
