<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>あ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="face-page">
  <main class="face-stage" aria-label="泣きながら笑っているように加工された日本人高年男性の顔写真">
    <figure class="face-frame">
      <div class="face-photo-wrap">
        <img src="assets/japanese-old-man-scary.jpg" alt="日本人高年男性の写真を暗く不気味に加工した画像">
        <span class="tear tear-left" aria-hidden="true"></span>
        <span class="tear tear-right" aria-hidden="true"></span>
        <span class="fear-eye fear-eye-left" aria-hidden="true"></span>
        <span class="fear-eye fear-eye-right" aria-hidden="true"></span>
        <span class="face-noise" aria-hidden="true"></span>
      </div>
      <figcaption>
        Photo: malias, “Japanese old man”, CC BY 2.0. Horror effects and tears added in CSS.
      </figcaption>
    </figure>
  </main>
</body>
</html>
